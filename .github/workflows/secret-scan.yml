name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checked-out workspace inside the scan container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Scan complete repository history with Gitleaks
        uses: docker://zricethezav/gitleaks:v8.24.3
        with:
          args: detect --source=/github/workspace --redact --exit-code=1 --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/public-safety.mjs
